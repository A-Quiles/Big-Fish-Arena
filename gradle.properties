org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# ===== Anuncios (interruptor) =====
# false = la app sale SIN anuncios y sin el SDK de AdMob (no hay ingresos ni nada que declarar como anuncios).
# true  = vuelven los anuncios tal y como estaban (intersticial cada 5 partidas, cofre gratis, diamantes y perlas dobles).
# Al volver a activarlos: en Google Play Console cambia «Contiene anuncios» a Sí y revisa la sección de seguridad de los datos.
ADS_ENABLED=false

# ===== AdMob =====
# (solo se usan si ADS_ENABLED=true)
# IDs reales de la cuenta de AdMob (los usa la versión de publicación, la que sube a Google Play).
# La versión de depuración (debug) usa siempre los IDs de prueba de Google: así nunca ves ni tocas anuncios reales
# mientras pruebas, que AdMob lo castiga.
ADMOB_APP_ID=ca-app-pub-2789508041955037~6326245867
ADMOB_INTERSTITIAL_ID=ca-app-pub-2789508041955037/3535507556
ADMOB_REWARDED_ID=ca-app-pub-2789508041955037/2766274803
ADMOB_REWARDED_PEARLS_ID=ca-app-pub-2789508041955037/2270441620

# Versión. Antes de subir una versión nueva a Google Play, suma 1 a APP_VERSION_CODE.
APP_VERSION_CODE=1
APP_VERSION_NAME=1.0
